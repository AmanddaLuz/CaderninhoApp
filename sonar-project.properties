sonar.organization=amanddaluz
sonar.projectKey=AmanddaLuz_CaderninhoApp
sonar.projectName=Caderninho
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=app/src/main/java
sonar.tests=app/src/test
sonar.test.inclusions=app/src/test/**/*.kt

sonar.kotlin.binaries=app/build/tmp/kotlin-classes/debug
sonar.junit.reportPaths=app/build/test-results/testDebugUnitTest
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/kover/reportDebug.xml
sonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml
sonar.kotlin.detekt.reportPaths=app/build/reports/detekt/detekt.xml

sonar.coverage.exclusions=\
  **/*ScreenKt*.kt,\
  **/MainActivity.kt,\
  **/CaderninhoApp.kt,\
  **/ui/theme/**,\
  **/ui/navigation/**,\
  **/di/**,\
  **/data/local/dao/**,\
  **/data/local/CaderninhoDatabase.kt
