# Project-wide Gradle settings.
# org.gradle.java.home is intentionally NOT set here: it is machine-specific.
# CI resolves JDK 17 via actions/setup-java; locally, configure it in your own
# ~/.gradle/gradle.properties instead of committing a local path.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
